<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Haunt</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0f1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    #game-container {
      position: relative;
      width: min(100vw - 20px, 420px);
      aspect-ratio: 9 / 16;
      background: #101827;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.06);
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #101827 0%, #0a0f1a 100%);
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #dbeaff;
      z-index: 2;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(10,18,30,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 6px 10px;
      backdrop-filter: blur(4px);
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 19, 0.94);
      z-index: 10;
      transition: opacity 0.2s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }
    .panel {
      width: min(84%, 340px);
      background: rgba(15, 23, 34, 0.98);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 20px 18px;
      text-align: center;
      box-shadow: 0 16px 38px rgba(0,0,0,0.35);
    }
    .panel h1 {
      margin: 0 0 10px;
      font-size: clamp(36px, 9vw, 54px);
      letter-spacing: -0.06em;
      color: #f1f6ff;
      text-transform: uppercase;
    }
    .panel p {
      margin: 0;
      color: #bfd3ef;
      font-size: 14px;
      line-height: 1.6;
    }
    .panel button,
    .level-card {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }
    .panel button:active,
    .level-card:active { transform: scale(0.98); }
    .main-cta {
      margin-top: 18px;
      padding: 12px 22px;
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, #74aaf8 0%, #7ff5d2 100%);
      color: #09131d;
      box-shadow: 0 12px 28px rgba(116,170,248,0.35);
    }
    .secondary-cta {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      font-weight: 700;
      background: rgba(255,255,255,0.06);
      color: #edf5ff;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .level-badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
      background: rgba(120, 170, 255, 0.15);
      border: 1px solid rgba(120, 170, 255, 0.35);
      color: #bcd7ff;
    }
    .easy { background: rgba(80, 215, 170, 0.12); border-color: rgba(80, 215, 170, 0.4); color: #99f0d1; }
    .medium { background: rgba(255, 180, 82, 0.12); border-color: rgba(255, 180, 82, 0.4); color: #ffdca3; }
    .hard { background: rgba(255, 95, 113, 0.12); border-color: rgba(255, 95, 113, 0.4); color: #ffb4be; }
    .winner { background: rgba(154, 129, 255, 0.12); border-color: rgba(154, 129, 255, 0.35); color: #d7ccff; }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
      margin-bottom: 8px;
    }
    .level-card {
      padding: 12px 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #ebf3ff;
      text-align: center;
      min-height: 88px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
    .level-card.locked {
      opacity: 0.45;
      filter: grayscale(0.4);
    }
    .level-card .level-no {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .level-card .level-diff {
      font-size: 16px;
      font-weight: 800;
    }
    .level-card .level-target {
      font-size: 11px;
      opacity: 0.8;
    }
    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .result-actions button {
      padding: 10px 16px;
      font-weight: 700;
      font-size: 14px;
      background: rgba(255,255,255,0.07);
      color: #edf5ff;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="420" height="740"></canvas>

    <div id="hud">
      <div class="hud-box">LVL <span id="levelText">1</span></div>
      <div class="hud-box">SCORE <span id="scoreText">0</span></div>
      <div class="hud-box">LIVES <span id="livesText">3</span></div>
    </div>

    <div id="overlay">
      <div id="overlay-content" class="panel"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayContent = document.getElementById('overlay-content');

    const scoreText = document.getElementById('scoreText');
    const livesText = document.getElementById('livesText');
    const levelText = document.getElementById('levelText');

    const W = canvas.width;
    const H = canvas.height;

    const LEVELS = [
      { id: 1, name: 'Level 1', difficulty: 'Easy', badgeClass: 'easy', target: 400, spawn: 1.35, speed: 2.7, obstacleScale: 1.0 },
      { id: 2, name: 'Level 2', difficulty: 'Medium', badgeClass: 'medium', target: 500, spawn: 1.05, speed: 3.4, obstacleScale: 1.25 },
      { id: 3, name: 'Level 3', difficulty: 'Hard', badgeClass: 'hard', target: 600, spawn: 0.8, speed: 4.2, obstacleScale: 1.5 }
    ];

    const PROGRESS_KEY = 'haunt-unlocked-level';
    let unlockedLevels = Number(localStorage.getItem(PROGRESS_KEY) || 1);
    let currentLevelIndex = 0;
    let score = 0;
    let lives = 3;
    let state = 'menu';
    let obstacles = [];
    let collectibles = [];
    let particles = [];
    let spawnTimer = 0;
    let lastTime = 0;

    const player = {
      x: W / 2,
      y: H - 80,
      radius: 14,
      dragOriginX: null,
      isDragging: false
    };

    function saveProgress() {
      localStorage.setItem(PROGRESS_KEY, String(unlockedLevels));
    }

    function setHud() {
      scoreText.textContent = String(Math.floor(score));
      livesText.textContent = String(lives);
      levelText.textContent = String(currentLevelIndex + 1);
    }

    function resetGameState() {
      score = 0;
      lives = 3;
      obstacles = [];
      collectibles = [];
      particles = [];
      spawnTimer = 0;
      player.x = W / 2;
      player.y = H - 80;
      player.dragOriginX = null;
      player.isDragging = false;
      setHud();
    }

    function renderLevelMenu() {
      const menuHtml = `
        <div class="level-badge easy">Select Level</div>
        <h1>Haunt</h1>
        <p>Complete a level to unlock the next one. Each glowing orb is worth 5 points.</p>
        <div class="level-grid">
          ${LEVELS.map(level => {
            const unlocked = level.id <= unlockedLevels;
            return `
              <button class="level-card ${unlocked ? '' : 'locked'}" data-level="${level.id}" ${unlocked ? '' : 'disabled'}>
                <span class="level-no">Level ${level.id}</span>
                <span class="level-diff">${level.difficulty}</span>
                <span class="level-target">${unlocked ? 'Target ' + level.target : 'Locked'}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
      overlayContent.innerHTML = menuHtml;

      document.querySelectorAll('.level-card').forEach(button => {
        button.addEventListener('click', () => {
          const levelId = Number(button.dataset.level);
          if (levelId <= unlockedLevels) {
            startLevel(levelId);
          }
        });
      });
    }

    function startLevel(levelId) {
      currentLevelIndex = levelId - 1;
      resetGameState();
      state = 'playing';
      overlay.classList.add('hidden');
      setHud();
    }

    function handleLevelClear() {
      const currentLevel = LEVELS[currentLevelIndex];
      const nextLevel = currentLevel.id + 1;
      if (currentLevel.id >= unlockedLevels) {
        unlockedLevels = Math.min(LEVELS.length, currentLevel.id + 1);
        saveProgress();
      }

      state = 'level-clear';
      overlay.classList.remove('hidden');
      overlayContent.innerHTML = `
        <div class="level-badge winner">Level Cleared</div>
        <h1>Level ${currentLevel.id}</h1>
        <p>Score: ${Math.floor(score)}<br>Target: ${currentLevel.target}</p>
        <div class="result-actions">
          ${nextLevel <= LEVELS.length ? `<button class="main-cta" data-action="next">Play Level ${nextLevel}</button>` : `<button class="main-cta" data-action="menu">Back to Levels</button>`}
          <button class="secondary-cta" data-action="replay">Replay Level</button>
          <button class="secondary-cta" data-action="menu">Choose Level</button>
        </div>
      `;

      document.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          const action = button.dataset.action;
          if (action === 'next') {
            startLevel(nextLevel);
          } else if (action === 'replay') {
            startLevel(currentLevel.id);
          } else {
            renderLevelMenu();
          }
        });
      });
    }

    function handleGameOver() {
      state = 'gameover';
      overlay.classList.remove('hidden');
      overlayContent.innerHTML = `
        <div class="level-badge hard">Level Failed</div>
        <h1>Game Over</h1>
        <p>Score: ${Math.floor(score)}<br>Target: ${LEVELS[currentLevelIndex].target}</p>
        <div class="result-actions">
          <button class="main-cta" data-action="retry">Retry Level</button>
          <button class="secondary-cta" data-action="menu">Choose Level</button>
        </div>
      `;

      document.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          if (button.dataset.action === 'retry') {
            startLevel(LEVELS[currentLevelIndex].id);
          } else {
            renderLevelMenu();
          }
        });
      });
    }

    function spawnObstacle() {
      const level = LEVELS[currentLevelIndex];
      const size = 32 + Math.random() * 58;
      obstacles.push({
        x: Math.random() * (W - size),
        y: -30,
        w: size * level.obstacleScale,
        h: 18,
        vy: level.speed * (0.9 + Math.random() * 0.7)
      });
    }

    function spawnCollectible() {
      collectibles.push({
        x: 18 + Math.random() * (W - 36),
        y: -20,
        r: 8,
        vy: 2.6 + currentLevelIndex * 0.8
      });
    }

    function createBurst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * (2.5 + Math.random() * 3),
          vy: Math.sin(angle) * (2.5 + Math.random() * 3),
          life: 0.7 + Math.random() * 0.5,
          maxLife: 0.7 + Math.random() * 0.5,
          color,
          r: 2.5
        });
      }
    }

    function getTouchX(evt) {
      const rect = canvas.getBoundingClientRect();
      const px = evt.clientX - rect.left;
      return (px / rect.width) * W;
    }

    canvas.addEventListener('pointerdown', (evt) => {
      if (state !== 'playing') return;
      player.isDragging = true;
      player.dragOriginX = getTouchX(evt);
    }, { passive: true });

    canvas.addEventListener('pointermove', (evt) => {
      if (state !== 'playing' || !player.isDragging || player.dragOriginX === null) return;
      const currentX = getTouchX(evt);
      const move = currentX - player.dragOriginX;
      player.x = Math.max(player.radius, Math.min(W - player.radius, W / 2 + move));
    }, { passive: true });

    canvas.addEventListener('pointerup', () => {
      player.isDragging = false;
      player.dragOriginX = null;
    }, { passive: true });

    canvas.addEventListener('pointerleave', () => {
      player.isDragging = false;
      player.dragOriginX = null;
    }, { passive: true });

    function update(dt) {
      if (state !== 'playing') return;

      const level = LEVELS[currentLevelIndex];
      spawnTimer += dt;

      if (spawnTimer >= level.spawn) {
        spawnTimer = 0;
        spawnObstacle();
        if (Math.random() > 0.52) spawnCollectible();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.vy * 60 * dt;

        const hit =
          player.x > obs.x &&
          player.x < obs.x + obs.w &&
          player.y > obs.y &&
          player.y < obs.y + obs.h;

        if (hit) {
          obstacles.splice(i, 1);
          lives -= 1;
          createBurst(player.x, player.y, '#ff5f71', 18);
          setHud();
          if (lives <= 0) {
            handleGameOver();
            return;
          }
          continue;
        }

        if (obs.y > H + 40) {
          obstacles.splice(i, 1);
          score += 10;
          setHud();
        }
      }

      for (let i = collectibles.length - 1; i >= 0; i--) {
        const item = collectibles[i];
        item.y += (2.6 + currentLevelIndex * 0.8) * 60 * dt;

        const dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < player.radius + item.r + 5) {
          collectibles.splice(i, 1);
          score += 5;
          createBurst(item.x, item.y, '#7ef5d2', 12);
          setHud();
          continue;
        }

        if (item.y > H + 30) {
          collectibles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * 60 * dt;
        p.y += p.vy * 60 * dt;
        p.vy += 0.08 * 60 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (score >= level.target) {
        handleLevelClear();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const g = ctx.createRadialGradient(W / 2, H * 0.25, 20, W / 2, H / 2, H * 0.85);
      g.addColorStop(0, '#16253f');
      g.addColorStop(0.4, '#101827');
      g.addColorStop(1, '#090d16');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(125, 150, 255, 0.08)';
      ctx.beginPath();
      for (let x = 0; x < W; x += 40) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
      }
      for (let y = 0; y < H; y += 40) {
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }
      ctx.stroke();

      ctx.fillStyle = '#ff5f71';
      for (const o of obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }

      ctx.fillStyle = '#7ef5d2';
      ctx.shadowBlur = 16;
      ctx.shadowColor = '#7ef5d2';
      for (const item of collectibles) {
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / (p.maxLife || 1));
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#5fa6ff';
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#5fa6ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#0c1220';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius * 0.48, 0, Math.PI * 2);
      ctx.fill();
    }

    function tick(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(tick);
    }

    renderLevelMenu();
    setHud();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
