<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Haunt</title>
  <meta name="theme-color" content="#0d1020" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#0d1020; --board:#121828; --fg:#eef4ff; --haz:#ff566f; --me:#5fa6ff; --gh:#8f70ff; --line:#2a2d45; --btn:#eef4ff; --btnfg:#111827;
      --panel: rgba(15,18,27,.8); --panel2: rgba(19,23,35,.9);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:radial-gradient(circle at top,#1d2b4f 0%,#0d1020 30%,#090c15 100%);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
    body{display:grid;place-items:center;padding:12px}
    #wrap{position:relative;width:min(92vw,420px);height:min(94vh,740px);max-height:100%;background:var(--board);border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
    canvas{width:100%;height:100%;display:block;background:linear-gradient(180deg,#101725,#090d17)}
    #ui{position:absolute;inset:0;pointer-events:none}
    #bar{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#dfe7ff}
    .chip strong{font-size:13px;letter-spacing:.05em}
    #pulseBtn{position:absolute;right:18px;bottom:18px;border:none;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,#7ff5d2,#9bc6ff);color:#071018;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 15px 30px rgba(127,245,210,.28);pointer-events:auto;opacity:.35;transform:translateY(6px);transition:opacity .2s,transform .2s}
    #pulseBtn.ready{opacity:1;transform:translateY(0)}
    #pulseBtn:active{transform:scale(.97)}
    #overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,7,14,.46);backdrop-filter:blur(4px)}
    #overlay.hidden{display:none}
    .panel{width:min(82%,320px);background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.25)}
    h1{margin:0 0 8px;font-size:clamp(34px,8vw,52px);letter-spacing:-.06em}
    p{margin:0;color:#bfd0ef;line-height:1.45;font-size:14px}
    .cta{margin-top:18px;border:0;border-radius:14px;padding:14px 20px;background:linear-gradient(135deg,#89a9ff,#7ff5d2);font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#06131c;box-shadow:0 18px 30px rgba(127,245,210,.25)}
    .tiny{margin-top:12px;font-size:12px;opacity:.76}
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="420" height="740"></canvas>
    <div id="ui">
      <div id="bar">
        <div class="chip">Score <strong id="score">0</strong></div>
        <div class="chip">Best <strong id="best">0</strong></div>
        <div class="chip">Lives <strong id="lives">3</strong></div>
      </div>
      <button id="pulseBtn">Pulse</button>
    </div>
    <div id="overlay">
      <div class="panel">
        <h1>Haunt</h1>
        <p>Collect glowing seeds. Dodge the black shards. Survive long enough to become the ghost that never stops.</p>
        <button class="cta" id="startBtn">Start</button>
        <div class="tiny">Tip: fill your pulse meter to burst nearby danger.</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const livesEl = document.getElementById('lives');
    const startBtn = document.getElementById('startBtn');
    const pulseBtn = document.getElementById('pulseBtn');
    const overlay = document.getElementById('overlay');

    const W = canvas.width, H = canvas.height;
    const bestKey = 'haunt-best-score';
    let bestScore = Number(localStorage.getItem(bestKey) || 0);
    bestEl.textContent = bestScore;

    let state = 'menu';
    let last = 0;
    let targetX = W / 2;
    let score = 0;
    let pulse = 0;
    let combo = 0;
    let comboTimer = 0;
    let nextSpawn = 0.8;
    let shake = 0;

    const player = {
      x: W / 2,
      y: H - 70,
      r: 16,
      lives: 3,
      trail: [],
      flash: 0
    };

    let petals = [];
    let shards = [];
    let particles = [];

    function resetGame(){
      player.x = W / 2; player.y = H - 70; player.lives = 3; player.trail=[]; player.flash=0;
      petals=[]; shards=[]; particles=[]; score=0; pulse=0; combo=0; comboTimer=0; nextSpawn=0.8; shake=0;
      scoreEl.textContent = '0'; livesEl.textContent = '3'; pulseBtn.classList.remove('ready'); pulseBtn.disabled = true; pulseBtn.style.pointerEvents='none';
    }

    function startGame(){
      resetGame();
      state = 'playing';
      overlay.classList.add('hidden');
    }

    function endGame(){
      state = 'gameover';
      bestScore = Math.max(bestScore, Math.floor(score));
      localStorage.setItem(bestKey, String(bestScore));
      bestEl.textContent = bestScore;
      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <div class="panel">
          <h1>Run Ended</h1>
          <p>Score: <strong>${Math.floor(score)}</strong><br>Best: <strong>${bestScore}</strong></p>
          <button class="cta" id="restartBtn">Play Again</button>
          <div class="tiny">The darkness always returns.</div>
        </div>
      `;
      document.getElementById('restartBtn').addEventListener('click', ()=>{
        overlay.classList.add('hidden');
        startGame();
      });
    }

    function spawnPetal(){
      petals.push({
        x: 28 + Math.random() * (W - 56),
        y: -20,
        r: 8 + Math.random() * 8,
        vy: 120 + Math.random() * 100 + score * 0.04,
        hue: 35 + Math.random() * 70
      });
    }

    function spawnShard(){
      const s = 14 + Math.random() * 24;
      shards.push({
        x: 20 + Math.random() * (W - 40),
        y: -25,
        r: s,
        vx: (Math.random()-0.5) * 80,
        vy: 150 + Math.random() * 130,
        spin: (Math.random()-0.5) * 2.7,
        rot: Math.random() * Math.PI * 2
      });
    }

    function burst(x,y,color,count){
      for(let i=0;i<count;i++){
        particles.push({
          x,y,
          vx:(Math.random()-0.5)*220,
          vy:(Math.random()-0.5)*220,
          r:2+Math.random()*3,
          life:0.8+Math.random()*0.8,
          maxLife:0.8+Math.random()*0.8,
          c:color
        });
      }
    }

    function triggerPulse(){
      if(state !== 'playing' || !pulseBtn.classList.contains('ready')) return;
      pulse = 0;
      pulseBtn.classList.remove('ready');
      pulseBtn.disabled = true;
      pulseBtn.style.pointerEvents = 'none';
      burst(player.x, player.y, '#7ff5d2', 28);

      for(let i = shards.length-1; i>=0; i--){
        const s = shards[i];
        const dx = s.x - player.x; const dy = s.y - player.y; const d = Math.hypot(dx,dy) || 1;
        if(d < 110 + s.r){
          shards.splice(i,1);
          burst(s.x,s.y,'#ff566f',16);
          score += 25;
        }
      }
      scoreEl.textContent = Math.floor(score);
    }

    function hitPlayer(){
      if(player.flash > 0) return;
      player.flash = 1; player.lives -= 1; livesEl.textContent = player.lives; shake = 16; burst(player.x,player.y,'#ff566f',22);
      if(player.lives <= 0){ endGame(); }
    }

    function update(dt){
      if(state !== 'playing') return;

      player.x += (targetX - player.x) * 0.2;
      player.x = Math.max(player.r, Math.min(W - player.r, player.x));

      score += dt * 2.4;
      scoreEl.textContent = Math.floor(score);

      if(comboTimer > 0){ comboTimer -= dt; }
      if(comboTimer <= 0 && combo > 0) combo = 0;

      pulse += dt * 12;
      if(pulse >= 100){
        pulse = 100;
        pulseBtn.classList.add('ready');
        pulseBtn.disabled = false; pulseBtn.style.pointerEvents='auto';
      }

      nextSpawn -= dt;
      if(nextSpawn <= 0){
        nextSpawn = Math.max(0.45, 1.2 - score * 0.003);
        spawnPetal();
        if(Math.random() > 0.45) spawnShard();
      }

      for(let i=petals.length-1;i>=0;i--){
        const p = petals[i]; p.y += p.vy * dt; p.x += Math.sin((p.y + score)*0.05) * 18 * dt;
        if(Math.hypot(player.x-p.x, player.y-p.y) < player.r + p.r + 2){
          petals.splice(i,1);
          combo += 1; comboTimer = 2.4; score += 35 + combo * 10; pulse += 16;
          burst(p.x,p.y,'#7ff5d2',16);
        } else if(p.y > H + 30){
          petals.splice(i,1);
        }
      }

      for(let i=shards.length-1;i>=0;i--){
        const s = shards[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.spin * dt * 60;
        if(s.x < -30 || s.x > W + 30 || s.y > H + 40){ shards.splice(i,1); continue; }
        if(Math.hypot(player.x-s.x, player.y-s.y) < player.r + s.r){
          shards.splice(i,1); hitPlayer();
        }
      }

      player.trail.push({x:player.x,y:player.y,life:1});
      if(player.trail.length > 12) player.trail.shift();
      for(let i=0;i<player.trail.length;i++){ player.trail[i].life -= dt * 1.3; if(player.trail[i].life <=0) player.trail.splice(i,1); }

      for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if(p.life <=0) particles.splice(i,1); }
      if(player.flash > 0) player.flash = Math.max(0, player.flash - dt * 2.4);
      if(shake > 0) shake *= 0.8;
    }

    function drawBg(){
      ctx.clearRect(0,0,W,H);
      const g = ctx.createRadialGradient(W/2, H*0.22, 20, W/2, H/2, H*0.8);
      g.addColorStop(0,'#1d2c53'); g.addColorStop(.36,'#111a2d'); g.addColorStop(1,'#070b14');
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      ctx.save();
      ctx.translate(W/2,H/2); ctx.rotate((score*0.015) % (Math.PI*2)); ctx.translate(-W/2,-H/2);
      ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1;
      for(let i=0;i<7;i++){ ctx.beginPath(); ctx.arc(W/2, H/2, 40 + i*34, 0, Math.PI*2); ctx.stroke(); }
      ctx.restore();
      if(shake>0){ ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); }
    }

    function drawPetals(){
      for(const p of petals){
        ctx.save();
        ctx.fillStyle = `hsla(${p.hue},90%,68%,.95)`;
        ctx.shadowBlur = 18; ctx.shadowColor = `hsla(${p.hue},90%,70%,.9)`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(p.x,p.y-p.r*1.2); ctx.lineTo(p.x+p.r*0.5,p.y); ctx.lineTo(p.x,p.y+p.r*1.2); ctx.lineTo(p.x-p.r*0.5,p.y); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    function drawShards(){
      for(const s of shards){
        ctx.save();
        ctx.translate(s.x,s.y); ctx.rotate(s.rot);
        ctx.fillStyle='#0a0d12'; ctx.shadowBlur=20; ctx.shadowColor='rgba(255,86,111,.45)';
        ctx.beginPath(); ctx.moveTo(0,-s.r); ctx.lineTo(s.r*.72,0); ctx.lineTo(0,s.r); ctx.lineTo(-s.r*.72,0); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    function drawParticles(){
      for(const p of particles){
        ctx.globalAlpha = Math.max(0,p.life / p.maxLife);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawPlayer(){
      for(let i=0;i<player.trail.length;i++){
        const t = player.trail[i];
        ctx.fillStyle = `rgba(95,166,255,${t.life*0.32})`;
        ctx.beginPath(); ctx.arc(t.x,t.y,player.r*(.25 + i/player.trail.length),0,Math.PI*2); ctx.fill();
      }
      ctx.save();
      if(player.flash > 0){ ctx.shadowBlur = 24; ctx.shadowColor = 'rgba(255,86,111,.9)'; }
      else { ctx.shadowBlur = 22; ctx.shadowColor = 'rgba(95,166,255,.9)'; }
      ctx.fillStyle = player.flash > 0 ? '#ffd3dd' : '#5fa6ff';
      ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#09111d'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r*0.4,0,Math.PI*2); ctx.fill();
      ctx.restore();

      const pulseGlow = ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,80 + pulse*0.7);
      pulseGlow.addColorStop(0,'rgba(95,166,255,.26)'); pulseGlow.addColorStop(1,'rgba(95,166,255,0)');
      ctx.fillStyle = pulseGlow; ctx.beginPath(); ctx.arc(player.x,player.y,80 + pulse*0.7,0,Math.PI*2); ctx.fill();
    }

    function drawMeter(){
      const x = W-120, y = H-26, w = 96, h = 10;
      ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#7ff5d2'; ctx.fillRect(x,y,(pulse/100)*w,h);
      ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.strokeRect(x,y,w,h);
    }

    function render(){
      drawBg(); drawPetals(); drawShards(); drawParticles(); drawPlayer(); drawMeter();
    }

    function frame(ts){
      const dt = Math.min(.033,(ts-(last||ts))/1000); last = ts;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener('pointerdown', e => {
      const rect = canvas.getBoundingClientRect();
      targetX = ((e.clientX - rect.left) / rect.width) * W;
      if(state==='playing' && pulse>=100){ triggerPulse(); }
    });

    canvas.addEventListener('pointermove', e => {
      if(state !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      targetX = ((e.clientX - rect.left) / rect.width) * W;
    });

    pulseBtn.addEventListener('click', triggerPulse);
    startBtn.addEventListener('click', startGame);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
