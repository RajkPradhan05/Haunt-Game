<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Haunt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      background: #0a0e1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9/16;
      background: #0f1420;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10,14,26,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 1;
      pointer-events: all;
      transition: opacity 0.3s ease-out;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }
    #overlay-content {
      text-align: center;
      color: #e8f0ff;
    }
    #overlay-content h1 {
      font-size: 48px;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }
    #overlay-content p {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 12px;
      color: #b8c5e0;
      max-width: 280px;
    }
    #overlay-content button {
      margin-top: 20px;
      padding: 12px 28px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #5fa6ff 0%, #7ff5d2 100%);
      color: #0a0e1a;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(95,166,255,0.3);
    }
    #overlay-content button:active {
      transform: scale(0.98);
    }
    #stats {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #7fa3ff;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="stats">
      <span>Score: <strong id="score-text">0</strong></span>
      <span>Best: <strong id="best-text">0</strong></span>
      <span>Lives: <strong id="lives-text">3</strong></span>
    </div>
    <div id="overlay">
      <div id="overlay-content">
        <h1>Haunt</h1>
        <p>Drag your finger to move the ball.<br>Collect glowing orbs.<br>Dodge red obstacles.</p>
        <button id="start-btn">Start Game</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameContainer = document.getElementById('game-container');
    const overlay = document.getElementById('overlay');
    const overlayContent = document.getElementById('overlay-content');
    const startBtn = document.getElementById('start-btn');
    
    const scoreText = document.getElementById('score-text');
    const bestText = document.getElementById('best-text');
    const livesText = document.getElementById('lives-text');

    // Set canvas size
    canvas.width = 420;
    canvas.height = 740;
    const W = canvas.width;
    const H = canvas.height;

    // Game state
    let gameState = 'menu'; // menu, playing, gameOver
    let score = 0;
    let lives = 3;
    let bestScore = parseInt(localStorage.getItem('haunt-best') || '0');
    bestText.textContent = bestScore;

    // Player
    const player = {
      x: W / 2,
      y: H - 80,
      radius: 14,
      vx: 0,
      vy: 0
    };

    // Game objects
    let obstacles = [];
    let collectibles = [];
    let particles = [];
    let spawnTimer = 0;

    // Input - ONLY respond to drag, not tap-to-position
    let lastTouchX = null;
    let isDragging = false;

    // Timing
    let gameTime = 0;
    let lastFrame = Date.now();

    function getTouchPos(touch) {
      const rect = gameContainer.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const relX = (x / rect.width) * W;
      return Math.max(player.radius, Math.min(W - player.radius, relX));
    }

    gameContainer.addEventListener('pointerdown', (e) => {
      if (gameState === 'playing') {
        isDragging = true;
        lastTouchX = getTouchPos(e);
      }
    }, { passive: true });

    gameContainer.addEventListener('pointermove', (e) => {
      if (gameState === 'playing' && isDragging && lastTouchX !== null) {
        const currentX = getTouchPos(e);
        const deltaX = currentX - lastTouchX;
        
        // Move player by the delta amount (how much finger moved)
        player.x += deltaX;
        player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
        
        lastTouchX = currentX;
      }
    }, { passive: true });

    gameContainer.addEventListener('pointerup', () => {
      isDragging = false;
      lastTouchX = null;
    }, { passive: true });

    function spawnObstacle() {
      const w = 50 + Math.random() * 60;
      obstacles.push({
        x: Math.random() * (W - w),
        y: -30,
        w: w,
        h: 16,
        vy: 3 + gameTime * 0.01
      });
    }

    function spawnCollectible() {
      collectibles.push({
        x: Math.random() * (W - 20) + 10,
        y: -20,
        r: 8,
        vy: 2.5 + gameTime * 0.005,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * (3 + Math.random() * 2),
          vy: Math.sin(angle) * (3 + Math.random() * 2),
          life: 0.6,
          maxLife: 0.6,
          color: color,
          r: 3
        });
      }
    }

    function update(dt) {
      if (gameState !== 'playing') return;

      gameTime += dt;

      // Spawn obstacles
      spawnTimer += dt;
      const spawnRate = 1.5 - Math.min(0.8, gameTime * 0.05);
      if (spawnTimer > spawnRate) {
        spawnObstacle();
        if (Math.random() > 0.6) spawnCollectible();
        spawnTimer = 0;
      }

      // Update obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.vy;

        // Collision check
        if (
          player.x > obs.x &&
          player.x < obs.x + obs.w &&
          player.y > obs.y &&
          player.y < obs.y + obs.h
        ) {
          obstacles.splice(i, 1);
          lives--;
          livesText.textContent = lives;
          createParticles(player.x, player.y, '#ff6b7a', 12);
          if (lives <= 0) endGame();
          continue;
        }

        if (obs.y > H + 50) {
          obstacles.splice(i, 1);
          score += 10;
        }
      }

      // Update collectibles
      for (let i = collectibles.length - 1; i >= 0; i--) {
        const col = collectibles[i];
        col.y += col.vy;
        col.wobble += 0.08;

        // Collision check
        const dist = Math.hypot(player.x - col.x, player.y - col.y);
        if (dist < player.radius + col.r + 5) {
          collectibles.splice(i, 1);
          score += 25;
          createParticles(col.x, col.y, '#7ff5d2', 8);
          continue;
        }

        if (col.y > H + 50) {
          collectibles.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // gravity
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }

      scoreText.textContent = Math.floor(score);
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#0f1420';
      ctx.fillRect(0, 0, W, H);

      // Draw background grid
      ctx.strokeStyle = 'rgba(95,166,255,0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < W; i += 60) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, H);
        ctx.stroke();
      }

      // Draw obstacles (red)
      ctx.fillStyle = '#ff6b7a';
      for (const obs of obstacles) {
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      }

      // Draw collectibles (cyan glow)
      ctx.fillStyle = '#7ff5d2';
      ctx.shadowBlur = 16;
      ctx.shadowColor = '#7ff5d2';
      for (const col of collectibles) {
        ctx.beginPath();
        ctx.arc(col.x, col.y, col.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Draw particles
      for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Draw player (blue glow)
      ctx.fillStyle = '#5fa6ff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#5fa6ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw player core
      ctx.fillStyle = '#0a0e1a';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop() {
      const now = Date.now();
      const dt = Math.min((now - lastFrame) / 1000, 0.016); // Cap at 60fps
      lastFrame = now;

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      gameState = 'playing';
      score = 0;
      lives = 3;
      gameTime = 0;
      obstacles = [];
      collectibles = [];
      particles = [];
      spawnTimer = 0;
      player.x = W / 2;
      player.y = H - 80;
      isDragging = false;
      lastTouchX = null;

      overlay.classList.add('hidden');
      scoreText.textContent = '0';
      livesText.textContent = '3';
    }

    function endGame() {
      gameState = 'gameOver';
      isDragging = false;
      lastTouchX = null;
      
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('haunt-best', String(bestScore));
        bestText.textContent = bestScore;
      }

      overlay.classList.remove('hidden');
      overlayContent.innerHTML = `
        <h1>Game Over</h1>
        <p>Score: <strong>${Math.floor(score)}</strong><br>Best: <strong>${bestScore}</strong></p>
        <button id="restart-btn">Play Again</button>
      `;

      document.getElementById('restart-btn').addEventListener('click', startGame);
    }

    startBtn.addEventListener('click', startGame);

    // Start game loop
    lastFrame = Date.now();
    gameLoop();
  </script>
</body>
</html>
