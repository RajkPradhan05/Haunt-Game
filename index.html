<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Haunt</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0f1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    #game-container {
      position: relative;
      width: min(100vw - 20px, 420px);
      aspect-ratio: 9 / 16;
      background: #101827;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.06);
      touch-action: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #101827 0%, #0a0f1a 100%);
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #dbeaff;
      z-index: 2;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(10,18,30,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 6px 10px;
      backdrop-filter: blur(4px);
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 19, 0.9);
      z-index: 10;
      transition: opacity 0.2s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
      display: none;
    }
    .panel {
      width: min(82%, 320px);
      background: rgba(15, 23, 34, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px 20px;
      text-align: center;
      box-shadow: 0 16px 38px rgba(0,0,0,0.35);
    }
    .panel h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 9vw, 52px);
      letter-spacing: -0.06em;
      color: #f1f6ff;
    }
    .panel p {
      margin: 0;
      color: #bfd3ef;
      font-size: 14px;
      line-height: 1.6;
    }
    .panel button {
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(135deg, #74aaf8 0%, #7ff5d2 100%);
      color: #09131d;
      box-shadow: 0 12px 28px rgba(116,170,248,0.35);
    }
    .panel button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="420" height="740"></canvas>

    <div id="hud">
      <div class="hud-box">LVL <span id="levelText">1</span></div>
      <div class="hud-box">SCORE <span id="scoreText">0</span></div>
      <div class="hud-box">LIVES <span id="livesText">3</span></div>
    </div>

    <div id="overlay">
      <div class="panel">
        <h1 id="panelTitle">Haunt</h1>
        <p id="panelText">Drag your finger to move the ball. Dodge obstacles and collect glowing orbs.</p>
        <button id="actionBtn">Start Game</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const panelTitle = document.getElementById('panelTitle');
    const panelText = document.getElementById('panelText');
    const actionBtn = document.getElementById('actionBtn');
    const scoreText = document.getElementById('scoreText');
    const livesText = document.getElementById('livesText');
    const levelText = document.getElementById('levelText');

    const W = canvas.width;
    const H = canvas.height;
    let best = Number(localStorage.getItem('haunt-best') || 0);

    const LEVELS = [
      { id: 1, name: 'Level 1', difficulty: 'Easy', target: 120, spawn: 1.3, speed: 2.7, obstacleScale: 1.0 },
      { id: 2, name: 'Level 2', difficulty: 'Medium', target: 260, spawn: 1.0, speed: 3.3, obstacleScale: 1.3 },
      { id: 3, name: 'Level 3', difficulty: 'Hard', target: 420, spawn: 0.75, speed: 4.1, obstacleScale: 1.6 }
    ];

    let currentLevelIndex = 0;
    let score = 0;
    let lives = 3;
    let state = 'menu';
    let obstacles = [];
    let collectibles = [];
    let particles = [];
    let spawnTimer = 0;
    let lastTime = 0;

    const player = {
      x: W / 2,
      y: H - 80,
      radius: 14,
      dragOriginX: null,
      isDragging: false,
      deltaX: 0
    };

    function setHud() {
      scoreText.textContent = String(Math.floor(score));
      livesText.textContent = String(lives);
      levelText.textContent = String(currentLevelIndex + 1);
    }

    function resetGameState() {
      score = 0;
      lives = 3;
      obstacles = [];
      collectibles = [];
      particles = [];
      spawnTimer = 0;
      player.x = W / 2;
      player.y = H - 80;
      player.dragOriginX = null;
      player.isDragging = false;
      player.deltaX = 0;
      currentLevelIndex = 0;
      setHud();
    }

    function showLevelIntro() {
      const level = LEVELS[currentLevelIndex];
      state = 'intro';
      overlay.classList.remove('hidden');
      panelTitle.textContent = `${level.name}: ${level.difficulty}`;
      panelText.textContent = `Target score: ${level.target}. Ready?`;
      actionBtn.textContent = 'Continue';
      actionBtn.onclick = () => {
        state = 'playing';
        overlay.classList.add('hidden');
      };
    }

    function nextLevel() {
      if (currentLevelIndex < LEVELS.length - 1) {
        currentLevelIndex += 1;
        state = 'intro';
        const level = LEVELS[currentLevelIndex];
        overlay.classList.remove('hidden');
        panelTitle.textContent = `${level.name}: ${level.difficulty}`;
        panelText.textContent = `Target score: ${level.target}. Stay sharp.`;
        actionBtn.textContent = 'Start Level';
        actionBtn.onclick = () => {
          state = 'playing';
          overlay.classList.add('hidden');
        };
        setHud();
      } else {
        endGame(true);
      }
    }

    function startGame() {
      resetGameState();
      state = 'playing';
      overlay.classList.add('hidden');
      showLevelIntro();
      setHud();
    }

    function endGame(won = false) {
      state = 'gameover';
      if (score > best) {
        best = Math.floor(score);
        localStorage.setItem('haunt-best', String(best));
      }

      overlay.classList.remove('hidden');
      if (won) {
        panelTitle.textContent = 'You Win';
        panelText.textContent = `Final score: ${Math.floor(score)}\nBest score: ${best}`;
      } else {
        panelTitle.textContent = 'Game Over';
        panelText.textContent = `Final score: ${Math.floor(score)}\nBest score: ${best}`;
      }
      actionBtn.textContent = 'Play Again';
      actionBtn.onclick = () => startGame();
    }

    function spawnObstacle() {
      const level = LEVELS[currentLevelIndex];
      const size = 32 + Math.random() * 58;
      obstacles.push({
        x: Math.random() * (W - size),
        y: -30,
        w: size * level.obstacleScale,
        h: 18,
        vy: level.speed * (0.9 + Math.random() * 0.7)
      });
    }

    function spawnCollectible() {
      collectibles.push({
        x: 18 + Math.random() * (W - 36),
        y: -18,
        r: 8,
        vy: 2.6 + currentLevelIndex * 0.8
      });
    }

    function createBurst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * (2.5 + Math.random() * 3),
          vy: Math.sin(angle) * (2.5 + Math.random() * 3),
          life: 0.7 + Math.random() * 0.5,
          maxLife: 0.7 + Math.random() * 0.5,
          color,
          r: 2.5
        });
      }
    }

    function getTouchX(evt) {
      const rect = canvas.getBoundingClientRect();
      const px = evt.clientX - rect.left;
      return (px / rect.width) * W;
    }

    canvas.addEventListener('pointerdown', (evt) => {
      if (state !== 'playing') return;
      player.isDragging = true;
      player.dragOriginX = getTouchX(evt);
    }, { passive: true });

    canvas.addEventListener('pointermove', (evt) => {
      if (state !== 'playing' || !player.isDragging || player.dragOriginX === null) return;
      const currentX = getTouchX(evt);
      const move = currentX - player.dragOriginX;
      player.x = Math.max(player.radius, Math.min(W - player.radius, W / 2 + move));
    }, { passive: true });

    canvas.addEventListener('pointerup', () => {
      player.isDragging = false;
      player.dragOriginX = null;
    }, { passive: true });

    canvas.addEventListener('pointerleave', () => {
      player.isDragging = false;
      player.dragOriginX = null;
    }, { passive: true });

    function update(dt) {
      if (state !== 'playing') return;

      const level = LEVELS[currentLevelIndex];
      spawnTimer += dt;

      if (spawnTimer >= level.spawn) {
        spawnTimer = 0;
        spawnObstacle();
        if (Math.random() > 0.55) spawnCollectible();
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.y += obs.vy * 60 * dt;

        const hit =
          player.x > obs.x &&
          player.x < obs.x + obs.w &&
          player.y > obs.y &&
          player.y < obs.y + obs.h;

        if (hit) {
          obstacles.splice(i, 1);
          lives -= 1;
          createBurst(player.x, player.y, '#ff5f71', 18);
          setHud();
          if (lives <= 0) {
            endGame(false);
            return;
          }
          continue;
        }

        if (obs.y > H + 40) {
          obstacles.splice(i, 1);
          score += 10;
          setHud();
        }
      }

      for (let i = collectibles.length - 1; i >= 0; i--) {
        const item = collectibles[i];
        item.y += (2.6 + currentLevelIndex * 0.8) * 60 * dt;

        const dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < player.radius + item.r + 5) {
          collectibles.splice(i, 1);
          score += 20;
          createBurst(item.x, item.y, '#7ef5d2', 12);
          setHud();
          continue;
        }

        if (item.y > H + 30) {
          collectibles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * 60 * dt;
        p.y += p.vy * 60 * dt;
        p.vy += 0.08 * 60 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (score >= level.target) {
        nextLevel();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const g = ctx.createRadialGradient(W / 2, H * 0.25, 20, W / 2, H / 2, H * 0.85);
      g.addColorStop(0, '#16253f');
      g.addColorStop(0.4, '#101827');
      g.addColorStop(1, '#090d16');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(125, 150, 255, 0.08)';
      ctx.beginPath();
      for (let x = 0; x < W; x += 40) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
      }
      for (let y = 0; y < H; y += 40) {
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
      }
      ctx.stroke();

      ctx.fillStyle = '#ff5f71';
      for (const o of obstacles) {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }

      ctx.fillStyle = '#7ef5d2';
      ctx.shadowBlur = 16;
      ctx.shadowColor = '#7ef5d2';
      for (const item of collectibles) {
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / (p.maxLife || 1));
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#5fa6ff';
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#5fa6ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#0c1220';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius * 0.48, 0, Math.PI * 2);
      ctx.fill();
    }

    function tick(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(tick);
    }

    actionBtn.onclick = () => startGame();
    resetGameState();
    setHud();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
